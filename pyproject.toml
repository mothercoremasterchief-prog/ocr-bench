[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-bench"
version = "0.3.0"
description = "Engine-agnostic OCR quality scoring — no ground truth needed"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "OpenOCR", email = "hello@open-ocr.com" }]
keywords = ["ocr", "benchmark", "quality", "scoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "wordfreq>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[project.scripts]
ocr-bench = "ocr_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
