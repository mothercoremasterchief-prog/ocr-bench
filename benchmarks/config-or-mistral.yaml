endpoints:
  - name: openrouter/mistral-small-3.1-24b
    type: openai_vision
    url: https://openrouter.ai/api/v1/chat/completions
    api_key_env: OPENROUTER_API_KEY
    model: mistralai/mistral-small-3.1-24b-instruct:free
    timeout: 90
    max_retries: 2
    retry_delay: 15

corpus:
  images_dir: ./images
  ground_truth_dir: ./ground-truth

output:
  json_path: ./results/openrouter-mistral/results.json
  markdown_path: ./results/openrouter-mistral/results.md
