endpoints:
  - name: openrouter/qwen3-vl-30b
    type: openai_vision
    url: https://openrouter.ai/api/v1/chat/completions
    api_key_env: OPENROUTER_API_KEY
    model: qwen/qwen3-vl-30b-a3b-thinking
    timeout: 90
    max_retries: 2
    retry_delay: 15

  - name: openrouter/qwen3-vl-235b
    type: openai_vision
    url: https://openrouter.ai/api/v1/chat/completions
    api_key_env: OPENROUTER_API_KEY
    model: qwen/qwen3-vl-235b-a22b-thinking
    timeout: 90
    max_retries: 2
    retry_delay: 15

  - name: openrouter/gemma-3-27b-free
    type: openai_vision
    url: https://openrouter.ai/api/v1/chat/completions
    api_key_env: OPENROUTER_API_KEY
    model: google/gemma-3-27b-it:free
    timeout: 90
    max_retries: 2
    retry_delay: 15

corpus:
  images_dir: ./images
  ground_truth_dir: ./ground-truth

output:
  json_path: ./results/openrouter/results.json
  markdown_path: ./results/openrouter/results.md
