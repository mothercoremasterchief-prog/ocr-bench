# OCR-369: DeepInfra vision models
endpoints:
  - name: deepinfra/llama-3.2-11b-vision
    type: openai_vision
    url: https://api.deepinfra.com/v1/openai/chat/completions
    api_key_env: DEEPINFRA_API_KEY
    model: meta-llama/Llama-3.2-11B-Vision-Instruct
    timeout: 120
    max_retries: 2
    retry_delay: 15

  - name: deepinfra/qwen2.5-vl-72b
    type: openai_vision
    url: https://api.deepinfra.com/v1/openai/chat/completions
    api_key_env: DEEPINFRA_API_KEY
    model: Qwen/Qwen2.5-VL-72B-Instruct
    timeout: 120
    max_retries: 2
    retry_delay: 15

corpus:
  images_dir: ./images
  ground_truth_dir: ./ground-truth

output:
  json_path: ./results/deepinfra/results.json
  markdown_path: ./results/deepinfra/results.md
