endpoints:
  - name: openrouter/nemotron-nano-12b-vl
    type: openai_vision
    url: https://openrouter.ai/api/v1/chat/completions
    api_key_env: OPENROUTER_API_KEY
    model: nvidia/nemotron-nano-12b-v2-vl:free
    timeout: 90
    max_retries: 2
    retry_delay: 15

  - name: openrouter/mistral-small-3.1-free
    type: openai_vision
    url: https://openrouter.ai/api/v1/chat/completions
    api_key_env: OPENROUTER_API_KEY
    model: mistralai/mistral-small-3.1-24b-instruct:free
    timeout: 90
    max_retries: 2
    retry_delay: 15

  - name: openrouter/gemma-3-12b-free
    type: openai_vision
    url: https://openrouter.ai/api/v1/chat/completions
    api_key_env: OPENROUTER_API_KEY
    model: google/gemma-3-12b-it:free
    timeout: 90
    max_retries: 2
    retry_delay: 15

  - name: openrouter/gemma-3-4b-free
    type: openai_vision
    url: https://openrouter.ai/api/v1/chat/completions
    api_key_env: OPENROUTER_API_KEY
    model: google/gemma-3-4b-it:free
    timeout: 90
    max_retries: 2
    retry_delay: 15

corpus:
  images_dir: ./images
  ground_truth_dir: ./ground-truth

output:
  json_path: ./results/or-free-vision/results.json
  markdown_path: ./results/or-free-vision/results.md
