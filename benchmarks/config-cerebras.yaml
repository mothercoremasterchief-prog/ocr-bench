# OCR-369: Cerebras free-tier vision models
endpoints:
  - name: cerebras/llama-3.2-11b-vision
    type: openai_vision
    url: https://api.cerebras.ai/v1/chat/completions
    api_key_env: CEREBRAS_API_KEY
    model: llama-3.2-11b-vision
    timeout: 120
    max_retries: 2
    retry_delay: 15

corpus:
  images_dir: ./images
  ground_truth_dir: ./ground-truth

output:
  json_path: ./results/cerebras/results.json
  markdown_path: ./results/cerebras/results.md
