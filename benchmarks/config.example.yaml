# Benchmark harness configuration
# Copy to config.yaml and adjust endpoints/paths.

endpoints:
  # Local engines (OpenOCR docker containers)
  - name: tesseract-local
    type: local
    url: http://localhost:8101/v1/ocr
    timeout: 120

  - name: easyocr-local
    type: local
    url: http://localhost:8100/v1/ocr
    timeout: 120

  # OpenOCR router (auto-selects engine)
  - name: openocr-router
    type: openocr_router
    url: http://localhost:3337/v1/ocr
    timeout: 120

  # Cloud vision models (OpenAI-compatible chat/completions)
  - name: gpt-4o
    type: openai_vision
    url: https://api.openai.com/v1/chat/completions
    api_key_env: OPENAI_API_KEY
    model: gpt-4o
    timeout: 60
    max_retries: 3
    retry_delay: 15

  - name: gemini-flash
    type: openai_vision
    url: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
    api_key_env: GOOGLE_API_KEY
    model: gemini-2.0-flash
    timeout: 60

  - name: claude-sonnet
    type: openai_vision
    url: https://api.anthropic.com/v1/messages
    api_key_env: ANTHROPIC_API_KEY
    model: claude-sonnet-4-20250514
    timeout: 60

corpus:
  images_dir: ./images
  ground_truth_dir: ./ground-truth
  # pdf_dir: /home/ben/openocr-staging/test-corpus/pdf

output:
  json_path: ./results.json
  markdown_path: ./results.md
