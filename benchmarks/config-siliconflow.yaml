# OCR-369: SiliconFlow free-tier vision models
endpoints:
  - name: siliconflow/qwen2.5-vl-72b
    type: openai_vision
    url: https://api.siliconflow.cn/v1/chat/completions
    api_key_env: SILICONFLOW_API_KEY
    model: Qwen/Qwen2.5-VL-72B-Instruct
    timeout: 120
    max_retries: 2
    retry_delay: 20

  - name: siliconflow/qwen2.5-vl-32b
    type: openai_vision
    url: https://api.siliconflow.cn/v1/chat/completions
    api_key_env: SILICONFLOW_API_KEY
    model: Qwen/Qwen2.5-VL-32B-Instruct
    timeout: 120
    max_retries: 2
    retry_delay: 20

  - name: siliconflow/qwen3-vl-32b
    type: openai_vision
    url: https://api.siliconflow.cn/v1/chat/completions
    api_key_env: SILICONFLOW_API_KEY
    model: Qwen/Qwen3-VL-32B
    timeout: 120
    max_retries: 2
    retry_delay: 20

  - name: siliconflow/qwen3-vl-8b
    type: openai_vision
    url: https://api.siliconflow.cn/v1/chat/completions
    api_key_env: SILICONFLOW_API_KEY
    model: Qwen/Qwen3-VL-8B
    timeout: 120
    max_retries: 2
    retry_delay: 20

  - name: siliconflow/deepseek-vl2
    type: openai_vision
    url: https://api.siliconflow.cn/v1/chat/completions
    api_key_env: SILICONFLOW_API_KEY
    model: deepseek-ai/DeepSeek-VL2
    timeout: 120
    max_retries: 2
    retry_delay: 20

corpus:
  images_dir: ./images
  ground_truth_dir: ./ground-truth

output:
  json_path: ./results/siliconflow/results.json
  markdown_path: ./results/siliconflow/results.md
